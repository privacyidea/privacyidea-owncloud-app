# Local test stack for the privacyIDEA ownCloud app.
#
#   docker compose -f compose-dev.yml up -d --wait
#   ./dev/setup.sh            # one time: users, tokens, app configuration
#
# See dev/README.md for the full workflow.
#
# Versions are pinned. Override them in a `.env` file or in the shell, for example
#   OWNCLOUD_VERSION=10.16.7 docker compose -f compose-dev.yml up -d
# to run the same app against the old ownCloud release.

name: pi-owncloud-dev

services:
  owncloud:
    image: owncloud/server:${OWNCLOUD_VERSION:-11.1.0}
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      privacyidea:
        condition: service_healthy
    ports:
      - "${OWNCLOUD_PORT:-8080}:8080"
    environment:
      OWNCLOUD_DOMAIN: localhost:${OWNCLOUD_PORT:-8080}
      OWNCLOUD_TRUSTED_DOMAINS: localhost
      OWNCLOUD_DB_TYPE: mysql
      OWNCLOUD_DB_NAME: owncloud
      OWNCLOUD_DB_USERNAME: owncloud
      OWNCLOUD_DB_PASSWORD: owncloud
      OWNCLOUD_DB_HOST: mariadb
      OWNCLOUD_MYSQL_UTF8MB4: "true"
      OWNCLOUD_ADMIN_USERNAME: admin
      OWNCLOUD_ADMIN_PASSWORD: admin
      OWNCLOUD_REDIS_ENABLED: "true"
      OWNCLOUD_REDIS_HOST: redis
      OWNCLOUD_LOG_LEVEL: "0"
    healthcheck:
      test: ["CMD", "/usr/bin/healthcheck"]
      interval: 10s
      timeout: 10s
      retries: 30
    volumes:
      - oc_data:/mnt/data
      # The image keeps external apps in /mnt/data/apps (/var/www/owncloud/custom, URL /custom).
      # APP_DIR lets you test another checkout or a patched copy of the app.
      - ${APP_DIR:-./twofactor_privacyidea}:/mnt/data/apps/twofactor_privacyidea

  privacyidea:
    # Unofficial community image (not from NetKnights). Runs gunicorn with SQLite.
    image: gpappsoft/privacyidea-docker:${PRIVACYIDEA_VERSION:-3.13.3}
    ports:
      - "${PRIVACYIDEA_PORT:-8081}:8080"
    environment:
      PI_ADDRESS: 0.0.0.0
      PI_PORT: "8080"
      PI_ADMIN: admin
      PI_ADMIN_PASS: admin
      PI_PEPPER: dev-pepper-change-me
      PI_SECRET: dev-secret-change-me
      PI_LOGLEVEL: DEBUG
    healthcheck:
      test: ["CMD", "python", "/privacyidea/healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes:
      - pi_data:/privacyidea/etc/persistent
      - ./dev/privacyidea/users.passwd:/privacyidea/etc/users.passwd:ro

  # One-shot job. Creates the realm, tokens and policies in privacyIDEA. Run with
  #   docker compose -f compose-dev.yml run --rm setup-pi
  setup-pi:
    image: node:22-alpine
    profiles: ["tools"]
    depends_on:
      privacyidea:
        condition: service_healthy
    working_dir: /scripts
    volumes:
      - ./dev:/scripts:ro
      - ./dev/.state:/scripts/.state
    environment:
      PI_URL: http://privacyidea:8080
      DEV_STATE: ${DEV_STATE:-default}
    command: ["node", "setup-privacyidea.mjs"]

  mariadb:
    image: mariadb:10.11
    environment:
      MYSQL_ROOT_PASSWORD: owncloud
      MYSQL_USER: owncloud
      MYSQL_PASSWORD: owncloud
      MYSQL_DATABASE: owncloud
      MARIADB_AUTO_UPGRADE: "1"
    command: ["--max-allowed-packet=128M", "--innodb-log-file-size=64M"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - mariadb_data:/var/lib/mysql

  redis:
    image: redis:7
    command: ["--databases", "1"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  oc_data:
  mariadb_data:
  pi_data:
