name: Semgrep

# Static analysis for security problems. Copied from privacyidea-nextcloud-app.
# Findings do not fail the job. They show as code scanning alerts.

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: semgrep-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Needed to upload the SARIF report to the "Security" tab of GitHub.
      security-events: write

    # Run inside the official Semgrep image, so that the CLI and its dependencies are fixed.
    container:
      # Pinned by digest. This is the digest that privacyidea-nextcloud-app uses.
      image: semgrep/semgrep@sha256:59fbed6127ea7c5dde3ba6a85142733bb20ea9aaa36120c953904f1539aaf66e

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Semgrep
        # No SEMGREP_APP_TOKEN is needed. The rulesets are fetched without login.
        # The findings go to the log and, as a copy, to semgrep.sarif.
        # Add --error to make findings block the job after somebody has read the first results.
        run: |
          semgrep scan \
            --config=p/php \
            --config=p/javascript \
            --config=p/security-audit \
            --config=p/secrets \
            --exclude=vendor \
            --exclude=node_modules \
            --exclude=l10n \
            --sarif-output=semgrep.sarif

      - name: Upload SARIF to GitHub code scanning
        # A pull request from a fork gets a read-only token, and GitHub refuses the upload with it.
        # The findings of such a pull request are in the log of the step "Run Semgrep".
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: semgrep.sarif
          category: semgrep
