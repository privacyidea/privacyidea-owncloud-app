name: Release

# Set a tag "v<version>" and push it. The workflow makes a GitHub release for the tag.
# The text of the release is the section of Changelog.md for the version.
# The workflow attaches the unsigned archive twofactor_privacyidea-<version>.tar.gz. See dev/README.md.

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Make sure that the tag has the version of the app
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          app_version=$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' twofactor_privacyidea/appinfo/info.xml)
          if [ "$version" != "$app_version" ]; then
            echo "::error::The tag $TAG does not match <version>$app_version</version> in twofactor_privacyidea/appinfo/info.xml."
            exit 1
          fi

      - name: Get the section of the changelog
        env:
          TAG: ${{ github.ref_name }}
        run: sh .github/scripts/changelog-section.sh "${TAG#v}" > "$RUNNER_TEMP/notes.md"

      # The archive has the folder twofactor_privacyidea as it is in git at the tag. It is not signed.
      - name: Build the app archive
        env:
          TAG: ${{ github.ref_name }}
        run: |
          archive="$RUNNER_TEMP/twofactor_privacyidea-${TAG#v}.tar.gz"
          git archive --format=tar --prefix=twofactor_privacyidea/ HEAD:twofactor_privacyidea | gzip -n > "$archive"
          if tar -tzf "$archive" | grep -q 'appinfo/signature.json$'; then
            echo "::error::The archive contains appinfo/signature.json. Remove the file from git."
            exit 1
          fi
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" "$ARCHIVE"
